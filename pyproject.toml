[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelcut"
version = "0.1.0"
description = "Turn a raw talking-head clip into a captioned, jump-cut Instagram/TikTok reel. Any LLM plans the edit; ffmpeg renders it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.0"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=1.0", "openai>=1.50", "google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
reelcut = "reelcut.cli:main"

[tool.setuptools]
packages = ["reelcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
